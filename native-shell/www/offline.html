<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sushi-Ro Admin — Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f5f5f4;
        color: #1c1917;
        padding: 1.5rem;
        text-align: center;
      }
      h1 {
        font-size: 1.35rem;
      }
      p {
        max-width: 22rem;
        line-height: 1.45;
        color: #57534e;
      }
      button {
        margin-top: 1rem;
        border: 0;
        border-radius: 0.75rem;
        background: #1c1917;
        color: #fff;
        font-size: 1rem;
        font-weight: 600;
        padding: 0.85rem 1.25rem;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>No connection</h1>
      <p>
        Sushi-Ro Admin needs Wi‑Fi to reach the order server. Connect this iPad
        and try again.
      </p>
      <button type="button" onclick="window.location.reload()">Try again</button>
    </div>
  </body>
</html>
